
name: Update Ollama Models

on:
  schedule:
    # 毎日午前0時 (UTC) に実行
    - cron: "0 0 * * *"

  workflow_dispatch: # 手動実行も可能にする

permissions:
  contents: read

concurrency:
  group: update-ollama-models
  cancel-in-progress: false

jobs:
  update-model-json:
    runs-on: ubuntu-latest

    steps:
      # GitHub Appのアクセストークンを生成
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # リポジトリをクローン（GitHub Appのトークンを使用）
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # Node.js をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      # 必要な依存関係をインストール
      - name: Install dependencies
        run: npm install

      # スクリプトを実行
      - name: Run scraper script
        run: node main.js

      # 変更があればコミット＆プッシュ
      - name: Commit and push changes
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-token.outputs.app-user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email \
            "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git add docs/model.json
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update model.json for GitHub Pages"
          git push origin HEAD:main
